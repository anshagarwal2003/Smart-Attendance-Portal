{% extends "base.html" %}

{% block content %}
<div class="dashboard-header">
    <div>
        <p class="tagline">Admin Panel</p>
        <h1>Add Course</h1>
        <p class="muted-text">Create a new course (e.g., BTECH, BCA, MBA).</p>
    </div>

    <div>
        <a class="btn secondary-btn" href="/admin-dashboard">Back</a>
    </div>
</div>

<div class="form-card">
    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label>Course Name</label>
            <input type="text" name="course_name" placeholder="Example: BTECH, BCA, MBA" required>
        </div>

        <button class="btn primary-btn" type="submit">Add Course</button>
    </form>
</div>
{% endblock %}
