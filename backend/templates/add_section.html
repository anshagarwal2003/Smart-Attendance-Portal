{% extends "base.html" %}

{% block content %}
<div class="dashboard-header">
    <div>
        <p class="tagline">Admin Panel</p>
        <h1>Add Section</h1>
        <p class="muted-text">Create a new section under a course (e.g., A, B, C).</p>
    </div>

    <div>
        <a class="btn secondary-btn" href="/admin-dashboard">Back</a>
    </div>
</div>

<div class="form-card">
    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label>Select Course</label>
            <select name="course_name" required>
                <option value="">-- Select Course --</option>
                {% for row in courses %}
                    <option value="{{ row.course_name }}">{{ row.course_name }}</option>
                {% endfor %}
            </select>
            {% if not courses %}
                <p class="small-help" style="color: red;">No courses found. Please add a course first.</p>
            {% endif %}
        </div>

        <div class="form-group">
            <label>Section Name</label>
            <input type="text" name="section_name" placeholder="Example: A, B, C" required>
        </div>

        <button class="btn primary-btn" type="submit" {% if not courses %}disabled{% endif %}>Add Section</button>
    </form>
</div>
{% endblock %}
