<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Smart Attendance Web - AI Facial Recognition & Geofencing Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS LINK -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Zero-Flicker Theme Script -->
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>

<nav class="navbar">
    <a href="/" class="nav-brand" style="text-decoration: none;">
        <div class="logo-svg-wrap" style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f766e, #0284c7); border-radius: 12px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="11" r="3"/>
                <path d="M12 17.5v-1.5"/>
            </svg>
        </div>
        <div class="brand-text">
            <span class="brand-title">Smart Attendance</span>
        </div>
    </a>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/teacher-login">Teacher</a>
        <a href="/student-login">Student</a>
        <a href="/admin-login">Admin</a>
        <a href="/logout">Logout</a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">
            <span id="themeIcon">🌙</span>
            <span id="themeText">Dark</span>
        </button>
    </div>
</nav>

<div class="page-wrapper">
    {% block content %}{% endblock %}
</div>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div id="flashModalOverlay" class="flash-modal-overlay active">
            <div class="flash-modal-card">
                <div class="flash-modal-header">
                    <div class="flash-modal-title-wrap">
                        <span class="flash-modal-icon">ℹ️</span>
                        <h3>System Notification</h3>
                    </div>
                    <button class="flash-modal-close" onclick="closeFlashModal()">×</button>
                </div>
                <div class="flash-modal-body">
                    {% for category, msg in messages %}
                        <p class="flash-message-item {{ category }}">{{ msg }}</p>
                    {% endfor %}
                </div>
                <div class="flash-modal-footer">
                    <button class="btn primary-btn" onclick="closeFlashModal()">Got It, Close</button>
                </div>
            </div>
        </div>
        <script>
            function closeFlashModal() {
                const modal = document.getElementById('flashModalOverlay');
                if (modal) modal.style.display = 'none';
            }
        </script>
    {% endif %}
{% endwith %}

<script>
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme') || 'light';
        const nextTheme = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
        updateThemeButton(nextTheme);
    }

    function updateThemeButton(theme) {
        const icon = document.getElementById('themeIcon');
        const text = document.getElementById('themeText');
        if (icon && text) {
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'Light';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Dark';
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('theme') || 'light';
        updateThemeButton(saved);
    });
</script>

</body>
</html>
